name: Compilar APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: SDK de Android (ya viene en el runner)
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties && ls $ANDROID_HOME/platforms
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compilar
        run: gradle assembleDebug --no-daemon
      - name: Renombrar
        run: cp app/build/outputs/apk/debug/app-debug.apk RingRaja.apk
      - uses: actions/upload-artifact@v4
        with:
          name: RingRaja-apk
          path: RingRaja.apk
      - name: Publicar descarga
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Ring Raja ${{ github.run_number }}
          body: Descarga RingRaja.apk desde el celular e instálalo.
          files: RingRaja.apk
