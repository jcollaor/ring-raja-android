<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Ring Raja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* VOICE: juego de barrio, travieso, humor latinoamericano
   IDEA: una gira de arcade por seis ciudades de Latinoamérica, vistas desde arriba
   PICTURE: el juego mismo: monumentos, casas típicas, plazas, autos, buses y vecinos
   COLOUR and TYPE: cada ciudad trae su paleta y su luz; Press Start 2P
   LAYOUT: lienzo 16:9 escalado, nombre para ranking sobre el lienzo */
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#1c1530;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative}
canvas{display:block;image-rendering:pixelated;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
#nameBox{position:absolute;left:50%;top:66%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;background:#1c1530e6;padding:10px 12px;border:2px solid #ffe45c;border-radius:8px;font:12px "Press Start 2P",monospace;color:#fff}
#nameBox[hidden]{display:none}
#nameBox input{font:16px "Press Start 2P",monospace;width:13ch;padding:8px;border-radius:4px;border:2px solid #7fc8c9;background:#fff;color:#1c1530;min-height:44px}
#nameBox input:focus-visible,#nameBox button:focus-visible{outline:3px solid #ffe45c;outline-offset:2px}
#nameBox button{font:12px "Press Start 2P",monospace;min-height:44px;padding:0 14px;border:0;border-radius:4px;background:#ffe45c;color:#1c1530;cursor:pointer}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
<canvas id="c" width="960" height="540" aria-label="Juego Ring Raja"></canvas>
<form id="nameBox" hidden><label for="alias">Tu nombre</label><input id="alias" maxlength="12" autocomplete="off"><button type="submit">Guardar</button></form>
</div></div>

let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended'){try{AC.resume();}catch(e){}}return AC;}
function tone(f,t0,dur,type,vol,f2){const a=ac();if(!a)return;try{const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+t0;o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(vol||0.2,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+0.05);}catch(e){}}

function srand(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
function buildSong(id){
 const S=SONGS[id],sc=SCALES[S.scale],r=srand(id.charCodeAt(0)*977+id.charCodeAt(2)*131),mel=[];let deg=4;
 for(let bar=0;bar<8;bar++){const ch=S.prog[bar%4];
  for(let st=0;st<S.spb;st++){const strong=S.strong.includes(st);
   if(r()<(strong?S.dens+0.25:S.dens*0.6)){
    if(strong){const opts=[ch,ch+2,ch+4,ch+7];let best=opts[0];for(const o of opts)if(Math.abs(o-deg)<Math.abs(best-deg))best=o;deg=best;}
    else deg+=[-1,1,1,-1,2,-2][Math.floor(r()*6)];
    deg=clamp(deg,0,11);mel.push({bar,st,deg});}}}
 const toMidi=d=>S.root+12+sc[((d%7)+7)%7]+12*Math.floor(d/7);
 return{...S,mel,toMidi,sc};
}
const mf=m=>440*Math.pow(2,(m-69)/12);
function musInit(){const a=ac();if(!a)return false;try{if(!MUS.gain){MUS.gain=a.createGain();MUS.gain.gain.value=MUS.on?0.45:0;MUS.gain.connect(a.destination);
 const b=a.createBuffer(1,Math.floor(a.sampleRate*0.4),a.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;MUS.noise=b;}}catch(e){return false;}return true;}
function mnote(f,t,dur,type,vol){const a=AC;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(MUS.gain);o.start(t);o.stop(t+dur+0.05);}
function mnoise(t,dur,vol,hp){const a=AC;const s=a.createBufferSource();s.buffer=MUS.noise;const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp;const g=a.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);s.connect(f);f.connect(g);g.connect(MUS.gain);s.start(t);s.stop(t+dur+0.02);}
function mkick(t,vol){const a=AC;const o=a.createOscillator(),g=a.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(45,t+0.12);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.16);o.connect(g);g.connect(MUS.gain);o.start(t);o.stop(t+0.2);}
function setMusic(on){MUS.on=on;LS.set('rr_music',on);if(MUS.gain&&AC){try{MUS.gain.gain.setTargetAtTime(on?0.45:0,AC.currentTime,0.05);}catch(e){}}}
function musTick(){
 if(!MUS.on||!AC||AC.state!=='running'||!musInit())return;
 const want=state==='travel'&&travel?CITIES[travel.to].id:C.id;
 if(state==='pause'){MUS.next=Math.max(MUS.next,AC.currentTime+0.05);return;}
 if(MUS.songId!==want){MUS.song=buildSong(want);MUS.songId=want;MUS.step=0;MUS.next=AC.currentTime+0.08;}
 const S=MUS.song,chasing=state==='play'&&lots.some(l=>l.n&&l.n.state==='chase');
 if(MUS.next<AC.currentTime-0.3)MUS.next=AC.currentTime+0.05;
 let guard=0;
 while(MUS.next<AC.currentTime+0.18&&guard++<16){
  const t=MUS.next,st=MUS.step%S.spb,bar=Math.floor(MUS.step/S.spb)%8,ch=S.prog[bar%4];
  try{
   if(S.bass[st]!=null){const d=ch+S.bass[st];mnote(mf(S.root-12+S.sc[d%7]+(d>=7?12:0)),t,S.sd*2.2,'triangle',0.22);}
   if(S.chord.includes(st))for(const k of [0,2,4]){const d=ch+k;mnote(mf(S.root+S.sc[d%7]+(d>=7?12:0)),t,S.sd*0.9,'square',0.028);}
   if(S.kick.includes(st))mkick(t,0.3);
   if(S.snare.includes(st))mnoise(t,0.12,0.12,1500);
   if(S.hat.includes(st)||(chasing&&st%2===0))mnoise(t,0.04,(S.accent&&S.accent.includes(st))?0.07:0.035,6000);
   for(const m of S.mel)if(m.bar===bar&&m.st===st){mnote(mf(S.toMidi(m.deg)),t,S.sd*1.6,S.lead,0.06);if(S.thirds)mnote(mf(S.toMidi(m.deg+2)),t,S.sd*1.6,S.lead,0.035);}
  }catch(e){}
  MUS.next+=S.sd*(chasing?0.92:1);MUS.step++;
 }
}

function protestSpot(n){if(n.ang0==null)n.ang0=n.slot*0.9;const ring=n.slot%2?1:0.8;return{x:MON.x+Math.cos(n.ang0)*190*ring,y:MON.y+Math.sin(n.ang0)*92*ring};}
function updLot(l,dt){
 const T=TYPES[l.type];
 if(l.cool>0)l.cool-=dt;if(l.bell>0)l.bell-=dt;
 if(l.state==='ringing'){l.t-=dt;
  if(l.t<=0){l.state='open';sfx.door();l.n={x:l.door.x,y:l.door.y+16,state:'look',t:T.look,ang:Math.PI/2,sw:Math.random()*6,face:1,walk:0};
   if(l.type==='perro')sfx.bark();floatText(l.door.x,l.door.y-50,getQ(l.type,'open'),'#fff');}}
 else if((l.state==='open'||l.state==='locked')&&l.n){const n=l.n;
  if(l.state==='locked'){l.lockT-=dt;if(l.lockT<=0){l.state='open';n.state='return';floatText(n.x,n.y-50,'¡La llave estaba bajo el macetero!','#fff');}}
  if(n.state==='look'){n.t-=dt;n.sw+=dt*2.2;n.ang=Math.PI/2+Math.sin(n.sw)*0.9;
   if(sees(n,T.range,T.half))spotted(l);else if(n.t<=0)success(l);}
  else if(n.state==='chase'){n.t-=dt;const d=Math.hypot(n.x-player.x,n.y-player.y);const vis=!pHid()&&player.inv<=0&&d<340*ch.stealth;
   if(vis){n.lx=player.x;n.ly=player.y;}
   const arrived=navTo(n,n.lx,n.ly,T.chase||100,dt);n.ang=Math.atan2(n.ly-n.y,n.lx-n.x);
   if(player.inv<=0&&player.z<16&&d<20)hurt(getQ(l.type,'caught'),l);
   else if(!vis&&arrived){n.state='search';n.t2=1.5;}
   else if(n.t<=0){n.state=afterChase(l);floatText(n.x,n.y-50,getQ(l.type,'giveup'),'#fff');}}
  else if(n.state==='search'){n.t2-=dt;n.ang+=dt*4;
   if(!pHid()&&player.inv<=0&&Math.hypot(n.x-player.x,n.y-player.y)<200*ch.stealth&&n.t>0)n.state='chase';
   else if(n.t2<=0){n.state=afterChase(l);floatText(n.x,n.y-50,getQ(l.type,'giveup'),'#fff');}}
  else if(n.state==='wander'){n.wt=(n.wt||0)-dt;n.say=(n.say==null?1:n.say)-dt;
   if(n.tx==null||n.wt<=0){const w=walkablePoint(l.door.x,l.door.y+36,90,20);n.tx=w.x;n.ty=w.y;n.wt=rnd(1,2.5);}
   navTo(n,n.tx,n.ty,45,dt);n.ang=Math.PI/2;
   if(n.say<=0){n.say=rnd(3,5);floatText(n.x,n.y-50,getQ(l.type,'locked'),'#ddd');}
   const d=Math.hypot(n.x-player.x,n.y-player.y);
   if(!pHid()&&player.inv<=0&&player.z<16&&d<90*ch.stealth){
    if(T.chase){n.state='chase';n.t=2.5;n.lx=player.x;n.ly=player.y;sfx.alert();floatText(n.x,n.y-50,'¡TÚ ME CERRASTE!','#ff6b6b');}
    else if(d<55)hurt(getQ(l.type,'caught'),l);}}
  else if(n.state==='toProtest'){const sp=protestSpot(n);n.ang=Math.PI/2;
   if(navTo(n,sp.x,sp.y,75,dt)||Math.hypot(sp.x-n.x,sp.y-n.y)<8)n.state='protest';}
  else if(n.state==='protest'){n.ang0+=dt*0.12;const sp=protestSpot(n);moveTo(n,sp.x,sp.y,60,dt);n.walk+=dt*6;n.ang=Math.PI/2;
   const d=Math.hypot(n.x-player.x,n.y-player.y);
   if(!pHid()&&player.inv<=0&&player.z<16&&d<85*ch.stealth){
    if(T.chase){n.state='chase';n.t=2.5;n.lx=player.x;n.ly=player.y;sfx.alert();floatText(n.x,n.y-50,'¡AHÍ ESTÁ EL DEL TIMBRE!','#ff6b6b');}
    else if(d<50)hurt(getQ(l.type,'caught'),l);}}
  else if(n.state==='stun'){n.stunT-=dt;n.ang+=dt*8;n.moving=false;if(n.stunT<=0)n.state=l.protest?'toProtest':l.state==='locked'?'wander':'return';}
  else if(n.state==='return'&&l.state==='locked'){n.state=l.protest?'toProtest':'wander';}

 }

const IMG={};let assetsReady=false;const PX=2,SCOLS={u:27,m:37};
const buf=document.createElement('canvas');buf.width=VW/PX;buf.height=VH/PX;const bctx=buf.getContext('2d');
let wtext=[],parts=[];
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function hex2rgb(h){const n=parseInt(h.slice(1,7),16);return[n>>16,(n>>8)&255,n&255];}
function rgb2hsl(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h=0,s=0;const l=(mx+mn)/2;if(mx!==mn){const d=mx-mn;s=l>0.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h/=6;}return[h,s,l];}
function hsl2rgb(h,s,l){if(s===0){const v=Math.round(l*255);return[v,v,v];}const q=l<0.5?l*(1+s):l+s-l*s,p=2*l-q;const f=t=>{if(t<0)t+=1;if(t>1)t-=1;return t<1/6?p+(q-p)*6*t:t<1/2?q:t<2/3?p+(q-p)*(2/3-t)*6:p;};return[Math.round(f(h+1/3)*255),Math.round(f(h)*255),Math.round(f(h-1/3)*255)];}
function loadAssets(){let n=0;for(const k of ['u','m']){const im=new Image();im.onload=()=>{if(++n===2){try{buildArt();assetsReady=true;}catch(e){console.error(e);}}};im.src=IMG_SRC[k];IMG[k]=im;}}
function tileCanvas(sheet,idx,s){const c=mk(16*s,16*s),x=c.getContext('2d');x.imageSmoothingEnabled=false;x.drawImage(IMG[sheet],(idx%SCOLS[sheet])*16,Math.floor(idx/SCOLS[sheet])*16,16,16,0,0,16*s,16*s);return c;}
const PAT={};
function pat(sheet,idx){const k=sheet+idx;if(!PAT[k])PAT[k]=bctx.createPattern(tileCanvas(sheet,idx,PX),'repeat');return PAT[k];}
function fillPat(sheet,idx,x,y,w,h){if(!assetsReady)return false;ctx.fillStyle=pat(sheet,idx);ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));return true;}
function tile(sheet,idx,x,y,w,h,flip){if(!assetsReady)return;w=w||32;h=h||32;const sx=(idx%SCOLS[sheet])*16,sy=Math.floor(idx/SCOLS[sheet])*16;
 if(flip){ctx.save();ctx.translate(Math.round(x)+w,Math.round(y));ctx.scale(-1,1);ctx.drawImage(IMG[sheet],sx,sy,16,16,0,0,w,h);ctx.restore();}else ctx.drawImage(IMG[sheet],sx,sy,16,16,Math.round(x),Math.round(y),w,h);}
function region(sheet,tx,ty,tw,th){const c=mk(tw*16,th*16);c.getContext('2d').drawImage(IMG[sheet],tx*16,ty*16,tw*16,th*16,0,0,tw*16,th*16);return c;}
function cropAlpha(src){const d=src.getContext('2d').getImageData(0,0,src.width,src.height).data;let x0=src.width,y0=src.height,x1=-1,y1=-1;
 for(let j=0;j<src.height;j++)for(let i=0;i<src.width;i++)if(d[(j*src.width+i)*4+3]>0){if(i<x0)x0=i;if(j<y0)y0=j;if(i>x1)x1=i;if(j>y1)y1=j;}
 if(x1<0)return src;const c=mk(x1-x0+1,y1-y0+1);c.getContext('2d').drawImage(src,-x0,-y0);return c;}
function recolor(src,pairs){const c=mk(src.width,src.height),x=c.getContext('2d');x.drawImage(src,0,0);const d=x.getImageData(0,0,c.width,c.height),a=d.data;const m=pairs.map(([f,t])=>[hex2rgb(f),hex2rgb(t)]);
 for(let i=0;i<a.length;i+=4){if(!a[i+3])continue;for(const [f,t] of m){if(a[i]===f[0]&&a[i+1]===f[1]&&a[i+2]===f[2]){a[i]=t[0];a[i+1]=t[1];a[i+2]=t[2];break;}}}x.putImageData(d,0,0);return c;}
function tintBody(src,hex,minS){const c=mk(src.width,src.height),x=c.getContext('2d');x.drawImage(src,0,0);const d=x.getImageData(0,0,c.width,c.height),a=d.data;const [th,ts,tl]=rgb2hsl(...hex2rgb(hex));
 for(let i=0;i<a.length;i+=4){if(!a[i+3])continue;const [h,s,l]=rgb2hsl(a[i],a[i+1],a[i+2]);if(s>minS){const nl=clamp(tl+(l-0.5)*0.85,0.04,0.97);const [r,g,b]=hsl2rgb(th,ts,nl);a[i]=r;a[i+1]=g;a[i+2]=b;}}x.putImageData(d,0,0);return c;}

const SPR={};
function charSprite(spec){const key=JSON.stringify(spec);if(SPR[key])return SPR[key];
 const base=mk(64,48);base.getContext('2d').drawImage(IMG.u,23*16,spec.b*48,64,48,0,0,64,48);
 const pairs=[],cls=CHB[spec.b];for(const k of ['shirt','hair','pants','hat','band']){if(spec[k]&&cls[k])cls[k].forEach((f,i)=>pairs.push([f,shade(spec[k],[1,0.8,0.64][i])]));}
 return SPR[key]=pairs.length?recolor(base,pairs):base;}
function dirFrom(dx,dy,prev){if(Math.abs(dx)<0.01&&Math.abs(dy)<0.01)return prev==null?1:prev;return Math.abs(dx)>Math.abs(dy)?(dx<0?0:3):(dy>0?1:2);}
function walkFrame(w,moving){return moving?[1,0,2,0][Math.floor(w*0.6)%4]:0;}

function circ(x,y,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,Math.max(0,r),0,Math.PI*2);ctx.fill();}
function ell(x,y,rx,ry,c){ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(x,y,Math.max(0,rx),Math.max(0,ry),0,0,Math.PI*2);ctx.fill();}
function poly(pts,c){ctx.fillStyle=c;ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fill();}

function shade(hex,a){const n=parseInt(hex.slice(1,7),16);let r=n>>16,g=(n>>8)&255,b=n&255;r=clamp(Math.round(r*a),0,255);g=clamp(Math.round(g*a),0,255);b=clamp(Math.round(b*a),0,255);return'#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);}

 rect(0,0,VW,VH,'#1c1530e6');text(rankTab==='daily'?'DESAFÍO DE HOY · '+CITIES[dailyCity()].name.toUpperCase():'RANKING DE LA GIRA',VW/2,40,rankTab==='daily'?14:20,'#ffe45c');
 button('GIRA',VW/2-200,56,190,28,()=>{rankTab='gira';},rankTab==='gira');button('DESAFÍO DE HOY',VW/2+10,56,190,28,()=>{rankTab='daily';},rankTab==='daily');
 const col=(title,list,x,msg)=>{text(title,x+190,100,10,'#7fc8c9');rect(x,110,380,2,'#7fc8c9');
  if(!list||!list.length){text(msg||'Sin puntajes todavía',x+190,160,9,'#bba9d6');return;}
  list.slice(0,10).forEach((r,i)=>{const y=130+i*30,c=i===0?'#ffe45c':i<3?'#fff':'#ddd';
   text((i+1)+'.',x+8,y,10,c,'left',false);text(String(r.alias||''),x+44,y,9,c,'left',false);text(String(r.city||r.char||''),x+200,y,6,'#bba9d6','left',false);text(String(r.score),x+374,y,10,c,'right',false);});};
 if(rankTab==='daily'){if(localDaily.date!==todayKey())localDaily={date:todayKey(),list:[]};col('ESTE EQUIPO (HOY)',localDaily.list,50,'Juega el desafío de hoy');col('TODOS (HOY)',sharedDaily,530,sharedDailyMsg);}
 else{col('ESTE EQUIPO',localRank,50,'Juega y guarda tu nombre');col('TODOS LOS JUGADORES',sharedRank,530,sharedMsg);}
 button('VOLVER',VW/2-90,460,180,46,()=>{state='title';},true);
}
function draw(){
 buttons=[];
 if(state==='travel'&&travel){drawTravel();return;}
 if(state==='inside'&&mini){drawMini();return;}
 const sk=shake>0?shake:0;drawWorld(Math.round((Math.random()-0.5)*14*sk/2)*2,Math.round((Math.random()-0.5)*14*sk/2)*2);
 if(flash>0)rect(0,0,VW,VH,'rgba(255,60,60,'+(flash*0.8)+')');
 if(state==='play'||state==='pause'){drawHUD();if(state==='pause')drawPause();}else if(state==='title')drawTitle();else if(state==='select')drawSelect();else if(state==='over')drawOver();else if(state==='album')drawAlbum();else drawRanking();
}
loadAssets();buildWorld();spawnPlayer();
let last=performance.now();
function loop(now){const dt=Math.min(0.05,Math.max(0,(now-last)/1000));last=now;try{update(dt);draw();}catch(e){console.error(e);}requestAnimationFrame(loop);}
requestAnimationFrame(loop);
}
</script>
